name: Generate Fake Contribution Snake

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate random contribution grid
        shell: bash
        run: |
          mkdir -p dist

          cat > generate_snake.py <<'PY'
          import random
          from datetime import date

          random.seed(date.today().isoformat())

          COLS = 53
          ROWS = 7
          CELL = 12
          GAP = 3
          STEP = CELL + GAP
          LEFT = 35
          TOP = 35

          WIDTH = LEFT * 2 + COLS * STEP
          HEIGHT = TOP * 2 + ROWS * STEP + 25

          LIGHT_LEVELS = [
              "#ebedf0",
              "#9be9a8",
              "#40c463",
              "#30a14e",
              "#216e39",
          ]

          DARK_LEVELS = [
              "#161b22",
              "#0e4429",
              "#006d32",
              "#26a641",
              "#39d353",
          ]

          grid = [
              [
                  random.choices(
                      range(5),
                      weights=[35, 20, 20, 15, 10]
                  )[0]
                  for _ in range(ROWS)
              ]
              for _ in range(COLS)
          ]

          def generate_svg(dark=False):
              background = "#0d1117" if dark else "#ffffff"
              text_color = "#c9d1d9" if dark else "#24292f"
              palette = DARK_LEVELS if dark else LIGHT_LEVELS

              cells = []

              for x in range(COLS):
                  for y in range(ROWS):
                      px = LEFT + x * STEP
                      py = TOP + y * STEP
                      color = palette[grid[x][y]]

                      cells.append(
                          f'<rect x="{px}" y="{py}" '
                          f'width="{CELL}" height="{CELL}" '
                          f'rx="2" fill="{color}"/>'
                      )

              points = []

              for x in range(COLS):
                  ys = (
                      range(ROWS)
                      if x % 2 == 0
                      else range(ROWS - 1, -1, -1)
                  )

                  for y in ys:
                      px = LEFT + x * STEP + CELL / 2
                      py = TOP + y * STEP + CELL / 2
                      points.append(f"{px},{py}")

              path_length = len(points) * STEP

              snake = f"""
              <polyline
                  points="{' '.join(points)}"
                  fill="none"
                  stroke="#39d353"
                  stroke-width="4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-dasharray="{path_length}"
                  stroke-dashoffset="{path_length}">
                  <animate
                      attributeName="stroke-dashoffset"
                      from="{path_length}"
                      to="0"
                      dur="12s"
                      repeatCount="indefinite"/>
              </polyline>
              """

              return f"""<svg xmlns="http://www.w3.org/2000/svg"
                  width="{WIDTH}"
                  height="{HEIGHT}"
                  viewBox="0 0 {WIDTH} {HEIGHT}">
                  <rect width="100%" height="100%" fill="{background}"/>
                  {''.join(cells)}
                  {snake}
                  <text x="{LEFT}" y="{HEIGHT - 8}"
                      font-family="Arial, sans-serif"
                      font-size="11"
                      fill="{text_color}">
                      Random contribution animation
                  </text>
              </svg>
              """

          with open(
              "dist/github-contribution-grid-snake.svg",
              "w",
              encoding="utf-8"
          ) as file:
              file.write(generate_svg())

          with open(
              "dist/github-contribution-grid-snake-dark.svg",
              "w",
              encoding="utf-8"
          ) as file:
              file.write(generate_svg(dark=True))

          print("SVG files generated successfully.")
          PY

          python generate_snake.py

      - name: Publish SVG files to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
