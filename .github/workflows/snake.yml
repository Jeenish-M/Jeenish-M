name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate authentic snake animation
        shell: bash
        run: |
          mkdir -p dist

          cat << 'EOF' > generate_snake.py
          import random

          COLS = 53
          ROWS = 7
          CELL = 11
          GAP = 3
          STEP = CELL + GAP
          PAD_X = 16
          PAD_Y = 16

          WIDTH = PAD_X * 2 + COLS * STEP - GAP
          HEIGHT = PAD_Y * 2 + ROWS * STEP - GAP
          SNAKE_LEN = 4
          DURATION = 24  # Total loop duration in seconds

          # Build continuous grid path (lawnmower traversal visiting all cells)
          path = []
          for x in range(COLS):
              y_range = range(ROWS) if x % 2 == 0 else range(ROWS - 1, -1, -1)
              for y in y_range:
                  path.append((x, y))

          TOTAL_STEPS = len(path)
          step_time = DURATION / TOTAL_STEPS

          # Distribute random contribution dots along the path
          random.seed(42)
          GREEN_LEVELS = ["#9be9a8", "#40c463", "#30a14e", "#216e39"]
          food_indices = set(random.sample(range(5, TOTAL_STEPS - 5), k=38))

          cell_data = {}
          for i, (x, y) in enumerate(path):
              if i in food_indices:
                  cell_data[(x, y)] = (True, random.choice(GREEN_LEVELS), i)
              else:
                  cell_data[(x, y)] = (False, None, i)

          THEMES = {
              "light": {
                  "bg": "#ffffff",
                  "empty": "#ebedf0",
                  "snake_head": "#6e40c9",
                  "snake_body": "#8a63d2",
              },
              "dark": {
                  "bg": "#0d1117",
                  "empty": "#ebedf0",     # Light blocks matching your screenshot
                  "snake_head": "#7928ca",
                  "snake_body": "#8957e5",
              }
          }

          def generate_svg(theme_name):
              theme = THEMES[theme_name]
              svg_parts = []

              svg_parts.append(
                  f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {WIDTH} {HEIGHT}" '
                  f'width="{WIDTH}" height="{HEIGHT}">\n'
                  f'  <rect width="100%" height="100%" fill="{theme["bg"]}" rx="6"/>\n'
              )

              # 1. Static & Animated Grid Cells
              for (x, y), (is_food, food_color, step_idx) in cell_data.items():
                  px = PAD_X + x * STEP
                  py = PAD_Y + y * STEP

                  if not is_food:
                      svg_parts.append(
                          f'  <rect x="{px}" y="{py}" width="{CELL}" height="{CELL}" '
                          f'rx="2" fill="{theme["empty"]}"/>\n'
                      )
                  else:
                      eat_progress = round(step_idx / TOTAL_STEPS, 4)
                      svg_parts.append(
                          f'  <rect x="{px}" y="{py}" width="{CELL}" height="{CELL}" rx="2" fill="{food_color}">\n'
                          f'    <animate attributeName="fill" dur="{DURATION}s" repeatCount="indefinite" '
                          f'calcMode="discrete" '
                          f'keyTimes="0;{eat_progress};1" '
                          f'values="{food_color};{theme["empty"]};{theme["empty"]}"/>\n'
                          f'  </rect>\n'
                      )

              # 2. Discrete Snake Segments (Head + Body blocks)
              for seg in range(SNAKE_LEN):
                  color = theme["snake_head"] if seg == 0 else theme["snake_body"]
                  size = CELL if seg == 0 else (CELL - 1)
                  offset_diff = 0 if seg == 0 else 0.5

                  x_vals, y_vals = [], []
                  for t in range(TOTAL_STEPS):
                      pos_idx = (t - seg) % TOTAL_STEPS
                      gx, gy = path[pos_idx]
                      x_vals.append(str(round(PAD_X + gx * STEP + offset_diff, 1)))
                      y_vals.append(str(round(PAD_Y + gy * STEP + offset_diff, 1)))

                  # Loop back to beginning smoothly
                  x_vals.append(x_vals[0])
                  y_vals.append(y_vals[0])

                  svg_parts.append(
                      f'  <rect width="{size}" height="{size}" rx="2.5" fill="{color}">\n'
                      f'    <animate attributeName="x" dur="{DURATION}s" repeatCount="indefinite" '
                      f'calcMode="discrete" values="{";".join(x_vals)}"/>\n'
                      f'    <animate attributeName="y" dur="{DURATION}s" repeatCount="indefinite" '
                      f'calcMode="discrete" values="{";".join(y_vals)}"/>\n'
                      f'  </rect>\n'
                  )

              svg_parts.append("</svg>")
              return "".join(svg_parts)

          with open("dist/github-contribution-grid-snake.svg", "w", encoding="utf-8") as f:
              f.write(generate_svg("light"))

          with open("dist/github-contribution-grid-snake-dark.svg", "w", encoding="utf-8") as f:
              f.write(generate_svg("dark"))
          EOF

          python generate_snake.py

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
